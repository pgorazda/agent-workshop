# Checks the dependencies of the bridge: known security advisories, licenses, and where crates come from.
# Run: cargo deny check   (CI runs it for every change to the bridge and once a week)

[graph]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
# Licenses that the bridge may carry. All of them are permissive: each one needs the copyright notice to ship with the
# binary, which `tools/notices.mjs` does (THIRD-PARTY-NOTICES.txt).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
