; Export presets of the Agent Workshop client (phase G-9). The apps are NOT signed or notarized.
; This file holds no secret, no identity, no personal data and no absolute path. Signing data would come from the environment.
; Get the templates and export with: node tools/export.mjs --platform windows|windows-arm64|linux|linux-arm64|macos|all  (see README.md)
; The macOS preset is universal: one app for Intel and Apple silicon. The release workflow (.github/workflows/release.yml) builds all five.
;
; export_filter "all_resources" exports every resource, because the client loads the sound files by a name that it builds.
; exclude_filter removes what a user does not need: the tests, the tools, the spike, GUT, the output folder, the texts and the
; sources of the pictures and the sounds. include_filter adds the scene files (JSON is not a resource).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="demo/*.json"
exclude_filter="test/*, tools/*, spikes/*, addons/*, out/*, art/image_src/*, art/sound_src/*, art/s6_support.gd, *.md, *.mjs"
export_path=""
patch_list=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://art/images/app_icon.png"
application/console_wrapper_icon=""
application/icon_interpolation=0
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name=""
application/product_name="Agent Workshop"
application/file_description="Agent Workshop"
application/copyright="Copyright (c) 2026 Pawel Gorazda"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

