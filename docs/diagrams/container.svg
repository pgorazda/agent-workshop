<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>Agent in a container, bridge and app on the host</title><desc>An agent runs inside a container and posts events to the bridge on the host machine, which sends them to the app on the same host.</desc>
<style>
  :root { --ink:#2C2C2A; --ink2:#5F5E5A; --line:#888780; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink2); font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .ic { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .zone { fill: none; stroke: var(--line); stroke-width: 0.8; stroke-dasharray: 4 4; }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .purple rect { fill:#EEEDFE; stroke:#534AB7; } .purple .th { fill:#3C3489; } .purple .ts { fill:#534AB7; }
  .teal rect { fill:#E1F5EE; stroke:#0F6E56; } .teal .th { fill:#085041; } .teal .ts { fill:#0F6E56; }
  .coral rect { fill:#FAECE7; stroke:#993C1D; } .coral .th { fill:#712B13; } .coral .ts { fill:#993C1D; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#F1EFE8; --ink2:#B4B2A9; --line:#888780; }
    .purple rect { fill:#3C3489; stroke:#AFA9EC; } .purple .th { fill:#CECBF6; } .purple .ts { fill:#AFA9EC; }
    .teal rect { fill:#085041; stroke:#5DCAA5; } .teal .th { fill:#9FE1CB; } .teal .ts { fill:#5DCAA5; }
    .coral rect { fill:#712B13; stroke:#F0997B; } .coral .th { fill:#F5C4B3; } .coral .ts { fill:#F0997B; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="zone" x="20" y="40" width="640" height="200" rx="12"/>
<text class="ts" x="36" y="60" text-anchor="start">Host machine</text>
<rect class="zone" x="40" y="75" width="215" height="150" rx="12"/>
<text class="ts" x="54" y="95" text-anchor="start">Container or dev container</text>
<g class="purple"><rect x="52" y="127" width="190" height="56" rx="8" stroke-width="0.8"/><text class="th" x="96" y="145" dominant-baseline="central">Claude Code</text><text class="ts" x="96" y="165" dominant-baseline="central">inside the container</text></g><g class="ic"><rect x="64" y="148" width="20" height="14" rx="2"/><polyline points="68,152 72,155 68,158"/><line x1="75" y1="159" x2="80" y2="159"/></g>
<g class="teal"><rect x="300" y="127" width="150" height="56" rx="8" stroke-width="0.8"/><text class="th" x="344" y="145" dominant-baseline="central">Bridge</text><text class="ts" x="344" y="165" dominant-baseline="central">on the host</text></g><g class="ic"><circle cx="322" cy="157" r="3.5"/><circle cx="314" cy="149" r="2.5"/><circle cx="330" cy="149" r="2.5"/><circle cx="322" cy="166" r="2.5"/><line x1="316" y1="151" x2="319.5" y2="155"/><line x1="328" y1="151" x2="324.5" y2="155"/><line x1="322" y1="160.5" x2="322" y2="163.5"/></g>
<g class="coral"><rect x="490" y="127" width="155" height="56" rx="8" stroke-width="0.8"/><text class="th" x="534" y="145" dominant-baseline="central">Workshop app</text><text class="ts" x="534" y="165" dominant-baseline="central">on the host</text></g><g class="ic"><rect x="502" y="147" width="20" height="12" rx="2"/><line x1="512" y1="159" x2="512" y2="163"/><line x1="507" y1="163" x2="517" y2="163"/></g>
<line class="arr" x1="244" y1="155" x2="298" y2="155" marker-end="url(#arrow)"/>
<line class="arr" x1="452" y1="155" x2="488" y2="155" marker-end="url(#arrow)"/>
<text class="ts" x="190" y="262" text-anchor="middle">HTTP POST to host.docker.internal</text>
<text class="ts" x="560" y="262" text-anchor="middle">WebSocket</text>
<text class="ts" x="340" y="286" text-anchor="middle">Start the bridge with --host set to an address the container reaches</text>
</svg>
