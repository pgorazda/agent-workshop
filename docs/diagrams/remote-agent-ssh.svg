<svg xmlns="http://www.w3.org/2000/svg" width="680" height="245" viewBox="0 0 680 245" role="img"><title>Agent on a remote server through an SSH tunnel</title><desc>An agent on a remote server posts events through an SSH tunnel to the bridge on your laptop, which sends them to the app.</desc>
<style>
  :root { --ink:#2C2C2A; --ink2:#5F5E5A; --line:#888780; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink2); font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .ic { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .zone { fill: none; stroke: var(--line); stroke-width: 0.8; stroke-dasharray: 4 4; }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .purple rect { fill:#EEEDFE; stroke:#534AB7; } .purple .th { fill:#3C3489; } .purple .ts { fill:#534AB7; }
  .teal rect { fill:#E1F5EE; stroke:#0F6E56; } .teal .th { fill:#085041; } .teal .ts { fill:#0F6E56; }
  .coral rect { fill:#FAECE7; stroke:#993C1D; } .coral .th { fill:#712B13; } .coral .ts { fill:#993C1D; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#F1EFE8; --ink2:#B4B2A9; --line:#888780; }
    .purple rect { fill:#3C3489; stroke:#AFA9EC; } .purple .th { fill:#CECBF6; } .purple .ts { fill:#AFA9EC; }
    .teal rect { fill:#085041; stroke:#5DCAA5; } .teal .th { fill:#9FE1CB; } .teal .ts { fill:#5DCAA5; }
    .coral rect { fill:#712B13; stroke:#F0997B; } .coral .th { fill:#F5C4B3; } .coral .ts { fill:#F0997B; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="zone" x="20" y="40" width="220" height="160" rx="12"/>
<text class="ts" x="36" y="60" text-anchor="start">Remote server</text>
<rect class="zone" x="300" y="40" width="360" height="160" rx="12"/>
<text class="ts" x="316" y="60" text-anchor="start">Your laptop</text>
<g class="purple"><rect x="35" y="95" width="190" height="56" rx="8" stroke-width="0.8"/><text class="th" x="79" y="113" dominant-baseline="central">Claude Code</text><text class="ts" x="79" y="133" dominant-baseline="central">on a remote server</text></g><g class="ic"><rect x="47" y="116" width="20" height="14" rx="2"/><polyline points="51,120 55,123 51,126"/><line x1="58" y1="127" x2="63" y2="127"/></g>
<g class="teal"><rect x="315" y="95" width="150" height="56" rx="8" stroke-width="0.8"/><text class="th" x="359" y="113" dominant-baseline="central">Bridge</text><text class="ts" x="359" y="133" dominant-baseline="central">local only</text></g><g class="ic"><circle cx="337" cy="125" r="3.5"/><circle cx="329" cy="117" r="2.5"/><circle cx="345" cy="117" r="2.5"/><circle cx="337" cy="134" r="2.5"/><line x1="331" y1="119" x2="334.5" y2="123"/><line x1="343" y1="119" x2="339.5" y2="123"/><line x1="337" y1="128.5" x2="337" y2="131.5"/></g>
<g class="coral"><rect x="495" y="95" width="155" height="56" rx="8" stroke-width="0.8"/><text class="th" x="539" y="113" dominant-baseline="central">Workshop app</text><text class="ts" x="539" y="133" dominant-baseline="central">your screen</text></g><g class="ic"><rect x="507" y="115" width="20" height="12" rx="2"/><line x1="517" y1="127" x2="517" y2="131"/><line x1="512" y1="131" x2="522" y2="131"/></g>
<line class="arr" x1="227" y1="123" x2="313" y2="123" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<line class="arr" x1="467" y1="123" x2="493" y2="123" marker-end="url(#arrow)"/>
<text class="ts" x="270" y="108" text-anchor="middle">SSH tunnel</text>
<text class="ts" x="270" y="146" text-anchor="middle">port 8787</text>
<text class="ts" x="480" y="176" text-anchor="middle">WebSocket</text>
<text class="ts" x="340" y="226" text-anchor="middle">From your laptop: ssh -R 8787:127.0.0.1:8787 user@server</text>
</svg>
