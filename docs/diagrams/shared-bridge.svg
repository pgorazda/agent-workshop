<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img"><title>One shared bridge with several agents and several apps</title><desc>Three agent machines send HTTP events to one bridge, which sends them over WebSocket to three Agent Workshop apps.</desc>
<style>
  :root { --ink:#2C2C2A; --ink2:#5F5E5A; --line:#888780; }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink2); font-size: 12px; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; }
  .ic { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .zone { fill: none; stroke: var(--line); stroke-width: 0.8; stroke-dasharray: 4 4; }
  .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .purple rect { fill:#EEEDFE; stroke:#534AB7; } .purple .th { fill:#3C3489; } .purple .ts { fill:#534AB7; }
  .teal rect { fill:#E1F5EE; stroke:#0F6E56; } .teal .th { fill:#085041; } .teal .ts { fill:#0F6E56; }
  .coral rect { fill:#FAECE7; stroke:#993C1D; } .coral .th { fill:#712B13; } .coral .ts { fill:#993C1D; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#F1EFE8; --ink2:#B4B2A9; --line:#888780; }
    .purple rect { fill:#3C3489; stroke:#AFA9EC; } .purple .th { fill:#CECBF6; } .purple .ts { fill:#AFA9EC; }
    .teal rect { fill:#085041; stroke:#5DCAA5; } .teal .th { fill:#9FE1CB; } .teal .ts { fill:#5DCAA5; }
    .coral rect { fill:#712B13; stroke:#F0997B; } .coral .th { fill:#F5C4B3; } .coral .ts { fill:#F0997B; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="zone" x="20" y="50" width="180" height="276" rx="12"/>
<text class="ts" x="110" y="72" text-anchor="middle">Where the agents run</text>
<g class="purple"><rect x="30" y="90" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="74" y="108" dominant-baseline="central">Claude Code</text><text class="ts" x="74" y="128" dominant-baseline="central">on a laptop</text></g><g class="ic"><rect x="42" y="111" width="20" height="14" rx="2"/><polyline points="46,115 50,118 46,121"/><line x1="53" y1="122" x2="58" y2="122"/></g>
<g class="purple"><rect x="30" y="170" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="74" y="188" dominant-baseline="central">OpenCode</text><text class="ts" x="74" y="208" dominant-baseline="central">on a dev server</text></g><g class="ic"><rect x="42" y="191" width="20" height="14" rx="2"/><polyline points="46,195 50,198 46,201"/><line x1="53" y1="202" x2="58" y2="202"/></g>
<g class="purple"><rect x="30" y="250" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="74" y="268" dominant-baseline="central">Pi, Hermes</text><text class="ts" x="74" y="288" dominant-baseline="central">in a container</text></g><g class="ic"><rect x="42" y="271" width="20" height="14" rx="2"/><polyline points="46,275 50,278 46,281"/><line x1="53" y1="282" x2="58" y2="282"/></g>
<g class="teal"><rect x="270" y="130" width="140" height="140" rx="12" stroke-width="0.8"/><text class="th" x="340" y="182" text-anchor="middle" dominant-baseline="central">Bridge</text><text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">one shared process</text><text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">sends to every app</text><text class="ts" x="340" y="244" text-anchor="middle" dominant-baseline="central">keeps no history</text></g><g class="ic"><circle cx="340" cy="156" r="3.5"/><circle cx="332" cy="148" r="2.5"/><circle cx="348" cy="148" r="2.5"/><circle cx="340" cy="165" r="2.5"/><line x1="334" y1="150" x2="337.5" y2="154"/><line x1="346" y1="150" x2="342.5" y2="154"/><line x1="340" y1="159.5" x2="340" y2="162.5"/></g>
<rect class="zone" x="480" y="50" width="180" height="276" rx="12"/>
<text class="ts" x="570" y="72" text-anchor="middle">Where people watch</text>
<g class="coral"><rect x="490" y="90" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="534" y="108" dominant-baseline="central">Workshop app</text><text class="ts" x="534" y="128" dominant-baseline="central">your screen</text></g><g class="ic"><rect x="502" y="110" width="20" height="12" rx="2"/><line x1="512" y1="122" x2="512" y2="126"/><line x1="507" y1="126" x2="517" y2="126"/></g>
<g class="coral"><rect x="490" y="170" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="534" y="188" dominant-baseline="central">Workshop app</text><text class="ts" x="534" y="208" dominant-baseline="central">a teammate</text></g><g class="ic"><rect x="502" y="190" width="20" height="12" rx="2"/><line x1="512" y1="202" x2="512" y2="206"/><line x1="507" y1="206" x2="517" y2="206"/></g>
<g class="coral"><rect x="490" y="250" width="160" height="56" rx="8" stroke-width="0.8"/><text class="th" x="534" y="268" dominant-baseline="central">Workshop app</text><text class="ts" x="534" y="288" dominant-baseline="central">a wall display</text></g><g class="ic"><rect x="502" y="270" width="20" height="12" rx="2"/><line x1="512" y1="282" x2="512" y2="286"/><line x1="507" y1="286" x2="517" y2="286"/></g>
<line class="arr" x1="192" y1="118" x2="268" y2="166" marker-end="url(#arrow)"/>
<line class="arr" x1="192" y1="198" x2="268" y2="198" marker-end="url(#arrow)"/>
<line class="arr" x1="192" y1="278" x2="268" y2="234" marker-end="url(#arrow)"/>
<line class="arr" x1="412" y1="166" x2="488" y2="118" marker-end="url(#arrow)"/>
<line class="arr" x1="412" y1="198" x2="488" y2="198" marker-end="url(#arrow)"/>
<line class="arr" x1="412" y1="234" x2="488" y2="278" marker-end="url(#arrow)"/>
<text class="ts" x="230" y="350" text-anchor="middle">HTTP POST from hooks</text>
<text class="ts" x="450" y="350" text-anchor="middle">WebSocket to each app</text>
</svg>
