# Keeps the pinned actions, the bridge dependencies (Cargo) and the scripts of the Godot client (npm) up to date. One pull request a week for each group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /bridge
    schedule:
      interval: weekly
    groups:
      bridge:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /godot
    schedule:
      interval: weekly
    groups:
      godot-tools:
        patterns: ['*']
