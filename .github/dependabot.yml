# Keeps the pinned actions and the bridge dependency up to date. One pull request a week for each group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /bridge
    schedule:
      interval: weekly
    groups:
      bridge:
        patterns: ['*']
