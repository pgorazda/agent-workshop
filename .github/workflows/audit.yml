# Looks for new security advisories in the dependencies of the bridge once a week. A new advisory can appear with no change
# in this repository. CI runs the full check (advisories, licenses, sources) for each change.

name: Audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories of the bridge dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          manifest-path: bridge/Cargo.toml
          command: check advisories
